# Throwaway Pydio Cells (Community) + MySQL for the ephemeral-Cells e2e job.
# Brought up by reusable-e2e.yml, bootstrapped + torn down per job. No external
# host, no stored URL/PAT secret. Admin creds are fixed/known (CI-only).
#
# The cells image is DIGEST-PINNED to the Cells version the fleet runs (4.x),
# never `:latest`, which moved to 5.0.0. To bump: pick the fleet's tag, read its
# digest with `docker buildx imagetools inspect pydio/cells:<tag>`, update the
# digest below, and re-run the e2e suites before bumping.
services:
  cells:
    # pydio/cells:4.4.17 (Community), matching the fleet's Cells version
    image: pydio/cells@sha256:71115c24e9189cc420598774a199ded8b9fafb0512f32c9acb67604153595d17
    restart: unless-stopped
    ports:
      - "48761:48761"
    environment:
      - CELLS_INSTALL_YAML=/pydio/config/install.yml
      - CELLS_JOBS_LOG_LEVEL=debug
      # debug also makes the built-in caddy write /var/cells/logs/caddy_access.log,
      # dumped on failure to see whether dropped requests reach Cells at all.
      - CELLS_LOG=debug
    volumes:
      - cellsdir:/var/cells
      - data:/var/cells/data
      - ./install-conf.yml:/pydio/config/install.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-check-certificate", "-q", "https://0.0.0.0:48761"]
      interval: 5s
      timeout: 5s
      retries: 5
      # Cold start (with MySQL init) is 60-120s, well past interval x retries, so
      # without a start_period the container is reported unhealthy for most of its
      # boot and only recovers later. bootstrap-cells.sh polls long enough to ride
      # that out, but the spurious unhealthy window makes a real failure to start
      # indistinguishable from a normal boot in the job log.
      start_period: 120s

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd
      MYSQL_DATABASE: cells
      MYSQL_USER: pydio
      MYSQL_PASSWORD: P@ssw0rd
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes:
      - mysqldir:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pP@ssw0rd"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
  cellsdir:
  mysqldir:
