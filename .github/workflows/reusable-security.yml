name: reusable-security
# Advisory-first security tier: gitleaks (secrets) + a per-language dependency vuln
# scanner (govulncheck / pip-audit / npm audit) + trivy config (IaC/Dockerfile
# misconfig). Mode is resolved centrally from penwern-ci/registry.tsv column 6
# (security-mode: none|advisory|gate). CodeQL is intentionally omitted — code
# scanning needs GitHub Advanced Security on private repos (Free plan excludes it).
on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
    secrets:
      PENWERN_CI_APP_CLIENT_ID:
        required: true
      PENWERN_CI_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  pick-runner:
    # Runs only when the caller opts in, never for Dependabot (new third-party
    # code stays on hosted runners); skipped jobs cost no minutes.
    if: vars.CI_RUNNER == 'campc' && github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Mint runner-probe token
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PENWERN_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.PENWERN_CI_APP_PRIVATE_KEY }}
          owner: penwern
          permission-organization-self-hosted-runners: read
      - name: Pick campc if online, else ubuntu-latest
        id: pick
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          online=0
          if [ -n "$GH_TOKEN" ]; then
            online=$(gh api /orgs/penwern/actions/runners --paginate \
              --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "campc"))] | length' \
              2>/dev/null | awk '{s+=$1} END {print s+0}') || online=0
          fi
          if [ "${online:-0}" -gt 0 ]; then runner=campc; else runner=ubuntu-latest; fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Selected runner: $runner (online campc runners: ${online:-0})"

  security:
    needs: pick-runner
    # Run even when pick-runner was skipped or failed; empty output falls back to hosted.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.pick-runner.outputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          path: target

      - name: Mint penwern-ci read token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PENWERN_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.PENWERN_CI_APP_PRIVATE_KEY }}
          owner: penwern
          repositories: penwern-ci
          permission-contents: read

      - name: Checkout penwern-ci
        uses: actions/checkout@v7
        with:
          repository: penwern/penwern-ci
          ref: v1
          path: penwern-ci
          token: ${{ steps.app_token.outputs.token }}

      - name: Read pinned tool versions
        run: cat penwern-ci/configs/tool-versions.env >> "$GITHUB_ENV"

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: target/go.mod
          cache: false

      - name: Install govulncheck (pinned)
        if: inputs.language == 'go'
        # GOTOOLCHAIN=auto so `go install` can fetch whatever Go govulncheck needs,
        # independent of the caller repo's go.mod. setup-go pins GOTOOLCHAIN=local to the
        # repo's version, but govulncheck v1.3.0 requires go >= 1.25; without this a repo
        # on go 1.24 (e.g. curate-event-watcher) fails to build it. The govulncheck binary,
        # once built, still analyses the repo with the repo's own toolchain.
        env:
          GOTOOLCHAIN: auto
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up uv (pinned; used when the caller has uv.lock)
        if: inputs.language == 'python'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install pip-audit (pinned)
        if: inputs.language == 'python'
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Set up Node
        if: startsWith(inputs.language, 'js-')
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: target/package-lock.json

      - name: Install gitleaks (pinned, all languages)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Install trivy (pinned, all languages)
        # Direct release tarball (like gitleaks above) — the contrib/install.sh script
        # is flaky and was failing the install step even after resolving the tag.
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy

      - name: Security scan (mode resolved centrally from penwern-ci/registry.tsv)
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          export PENWERN_CI_ROOT="$GITHUB_WORKSPACE/penwern-ci"
          bash "$GITHUB_WORKSPACE/penwern-ci/scripts/security-entry.sh" \
            "${GITHUB_REPOSITORY##*/}" \
            "${LANGUAGE}" \
            "$GITHUB_WORKSPACE/target"
