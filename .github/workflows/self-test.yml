name: self-test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bash-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Install golangci-lint (pinned)
        run: |
          . configs/tool-versions.env
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ruff (pinned)
        run: |
          . configs/tool-versions.env
          pip install "ruff==${RUFF_VERSION}"
      - name: Run the bash test suite
        run: bash tests/run.sh
