name: config-drift-audit
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC (near the Dependabot weekly cadence)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout penwern-ci
        uses: actions/checkout@v7

      - name: Mint cross-repo read token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PENWERN_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.PENWERN_CI_APP_PRIVATE_KEY }}
          owner: penwern
          permission-contents: read

      - name: Audit each registered repo for config drift
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          export PENWERN_CI_ROOT="$PWD"
          rc=0
          # A section scan stops at the NEXT table header, so it also captures the blank
          # line separating the two. Trailing blank lines are not config, so strip them
          # from both sides before diffing or every repo reports phantom drift.
          strip_trailing_blank() {
            awk 'NF{last=NR} {line[NR]=$0} END{for(i=1;i<=last;i++) print line[i]}' "$1"
          }
          clone_ok=0
          clone_attempted=0
          while IFS=$'\t' read -r repo lang mode owner || [ -n "$repo" ]; do
            case "$repo" in '#'*|'') continue;; esac
            clone_attempted=$((clone_attempted + 1))
            tmp="$(mktemp -d)"
            if ! gh repo clone "penwern/$repo" "$tmp" -- --depth 1 -q; then
              # A registered repo we cannot read is UNAUDITED, which in a summary is
              # indistinguishable from a repo that passed. Fail loudly instead: the usual
              # cause is the penwern-ci GitHub App not being granted access to that repo.
              echo "::error::cannot clone penwern/$repo: registered but unreadable, so it is UNAUDITED (check the penwern-ci App's repository access)"
              rc=1
              continue
            fi
            clone_ok=$((clone_ok + 1))

            # Language-agnostic: every registered repo carries the canonical
            # .gitattributes block. Compare only the marker-delimited section so
            # that repo-specific rules below it (export-ignore, linguist) vary freely.
            canonical_ga="$PENWERN_CI_ROOT/configs/gitattributes"
            if [ ! -f "$tmp/.gitattributes" ]; then
              echo "::error::config drift in $repo: .gitattributes absent"
              rc=1
            else
              extracted_ga="$(mktemp)"
              awk '/^# BEGIN penwern-ci canonical block/,/^# END penwern-ci canonical block/' \
                "$tmp/.gitattributes" > "$extracted_ga"
              if diff -u "$extracted_ga" "$canonical_ga" > /tmp/ga-drift-"$repo".out 2>&1; then
                echo "::notice::$repo .gitattributes canonical block in sync"
              else
                echo "::error::config drift in $repo: .gitattributes canonical block differs"
                cat /tmp/ga-drift-"$repo".out
                rc=1
              fi
              rm -f "$extracted_ga"
            fi

            case "$lang" in
              go)
                if bash scripts/check-drift.sh "$repo" "$tmp"; then
                  echo "::notice::$repo config in sync"
                else
                  echo "::error::config drift in $repo"
                  rc=1
                fi
                ;;
              python)
                if [ ! -f "$tmp/pyproject.toml" ]; then
                  echo "::error::config drift in $repo — pyproject.toml absent (config missing entirely)"
                  rc=1
                else
                  extracted_raw="$(mktemp)"; extracted="$(mktemp)"
                  awk '/^\[tool\.ruff/{f=1} /^\[/ && !/^\[tool\.ruff/{f=0} f' "$tmp/pyproject.toml" > "$extracted_raw"
                  strip_trailing_blank "$extracted_raw" > "$extracted"
                  canonical="$PENWERN_CI_ROOT/configs/ruff.pyproject-fragment.toml"
                  # Strip the leading comment lines from the canonical fragment before diffing
                  canonical_raw="$(mktemp)"; canonical_stripped="$(mktemp)"
                  sed -n '/^\[tool\.ruff/,$p' "$canonical" > "$canonical_raw"
                  strip_trailing_blank "$canonical_raw" > "$canonical_stripped"
                  if diff -u "$extracted" "$canonical_stripped" > /tmp/drift-diff-"$repo".out 2>&1; then
                    echo "::notice::$repo config in sync"
                  else
                    echo "::error::config drift in $repo"
                    cat /tmp/drift-diff-"$repo".out
                    rc=1
                  fi
                  rm -f "$extracted" "$extracted_raw" "$canonical_raw" "$canonical_stripped"
                fi
                ;;
              js-vanilla|js-next)
                if [ "$lang" = "js-vanilla" ]; then
                  canonical_eslint="$PENWERN_CI_ROOT/configs/eslint.vanilla.mjs"
                else
                  canonical_eslint="$PENWERN_CI_ROOT/configs/eslint.next.mjs"
                fi
                canonical_prettier="$PENWERN_CI_ROOT/configs/prettierrc.json"
                repo_eslint="$tmp/eslint.config.mjs"
                repo_prettier="$tmp/.prettierrc.json"
                if [ ! -f "$repo_eslint" ] || [ ! -f "$repo_prettier" ]; then
                  echo "::error::config drift in $repo — eslint.config.mjs or .prettierrc.json absent"
                  rc=1
                else
                  drift_js=0
                  if ! cmp -s "$repo_eslint" "$canonical_eslint"; then
                    echo "::error::config drift in $repo — eslint.config.mjs differs from canonical"
                    diff -u "$repo_eslint" "$canonical_eslint" || true
                    drift_js=1
                  fi
                  if ! cmp -s "$repo_prettier" "$canonical_prettier"; then
                    echo "::error::config drift in $repo — .prettierrc.json differs from canonical"
                    diff -u "$repo_prettier" "$canonical_prettier" || true
                    drift_js=1
                  fi
                  if [ "$drift_js" -eq 0 ]; then
                    echo "::notice::$repo config in sync"
                  else
                    rc=1
                  fi
                fi
                ;;
              ansible)
                # Two legitimate shapes share lang=ansible. A standalone role (meta/main.yml
                # present, the standard role marker) skips galaxy role-name, which the
                # deployment repo does not; the deployment repo excludes the vendored
                # geerlingguy.* roles, which a role repo has none of. One canonical file
                # cannot describe both, so pick by shape, the same way js-vanilla and
                # js-next each get their own eslint canonical.
                if [ -f "$tmp/meta/main.yml" ]; then
                  canonical_ansible_lint="$PENWERN_CI_ROOT/configs/ansible-lint.role.yml"
                  ansible_profile="role"
                else
                  canonical_ansible_lint="$PENWERN_CI_ROOT/configs/ansible-lint.yml"
                  ansible_profile="deployment"
                fi
                canonical_yamllint="$PENWERN_CI_ROOT/configs/yamllint.yml"
                repo_ansible_lint="$tmp/.ansible-lint"
                repo_yamllint="$tmp/.yamllint"
                if [ ! -f "$repo_ansible_lint" ]; then
                  echo "::error::config drift in $repo: .ansible-lint absent"
                  rc=1
                else
                  drift_ansible=0
                  if ! cmp -s "$repo_ansible_lint" "$canonical_ansible_lint"; then
                    echo "::error::config drift in $repo: .ansible-lint differs from canonical ($ansible_profile profile)"
                    diff -u "$repo_ansible_lint" "$canonical_ansible_lint" || true
                    drift_ansible=1
                  fi
                  # .yamllint is NOT required. run-lint.sh invokes yamllint with an explicit
                  # -c pointing at penwern-ci's canonical config, so a repo-local .yamllint is
                  # never read by the gate. Compare it only if a repo keeps one for local runs,
                  # so it cannot silently diverge from what CI enforces.
                  if [ -f "$repo_yamllint" ] && ! cmp -s "$repo_yamllint" "$canonical_yamllint"; then
                    echo "::error::config drift in $repo: .yamllint present but differs from canonical"
                    diff -u "$repo_yamllint" "$canonical_yamllint" || true
                    drift_ansible=1
                  fi
                  if [ "$drift_ansible" -eq 0 ]; then
                    echo "::notice::$repo config in sync ($ansible_profile profile)"
                  else
                    rc=1
                  fi
                fi
                ;;
              terraform)
                # terraform's gate is `terraform fmt -check` only — no per-repo config file
                # to drift (validate/tflint deferred). Nothing to diff; always in sync.
                echo "::notice::$repo config in sync (terraform: fmt-only gate, no config file)"
                ;;
              *)
                echo "::warning::drift audit not yet implemented for lang=$lang ($repo)"
                continue
                ;;
            esac
          done < registry.tsv
          if [ "$clone_attempted" -gt 0 ] && [ "$clone_ok" -eq 0 ]; then
            echo "::error::all $clone_attempted clone(s) failed — GitHub App token may be missing or invalid; audit is VOID"
            exit 2
          fi
          exit $rc
