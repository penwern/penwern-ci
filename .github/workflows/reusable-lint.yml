name: reusable-lint
on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
    secrets:
      PENWERN_CI_APP_CLIENT_ID:
        required: true
      PENWERN_CI_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          path: target

      - name: Mint penwern-ci read token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PENWERN_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.PENWERN_CI_APP_PRIVATE_KEY }}
          owner: penwern
          repositories: penwern-ci
          permission-contents: read

      - name: Checkout penwern-ci
        uses: actions/checkout@v7
        with:
          repository: penwern/penwern-ci
          ref: v1
          path: penwern-ci
          token: ${{ steps.app_token.outputs.token }}

      - name: Read pinned tool versions
        run: cat penwern-ci/configs/tool-versions.env >> "$GITHUB_ENV"

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: target/go.mod
          cache: false

      - name: Install golangci-lint (pinned, install only — lint-entry runs it)
        if: inputs.language == 'go'
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        if: inputs.language == 'python' || inputs.language == 'ansible'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ruff (pinned)
        if: inputs.language == 'python'
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Install ansible-lint + yamllint (pinned)
        if: inputs.language == 'ansible'
        run: pip install "ansible-lint==${ANSIBLE_LINT_VERSION}" "yamllint==${YAMLLINT_VERSION}"

      - name: Set up Node
        if: startsWith(inputs.language, 'js-')
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: target/package-lock.json

      - name: Set up Terraform (pinned)
        if: inputs.language == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false   # let terraform's own exit codes (0/3/2) reach lint-entry

      - name: Lint (mode resolved centrally from penwern-ci/registry.tsv)
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          export PENWERN_CI_ROOT="$GITHUB_WORKSPACE/penwern-ci"
          bash "$GITHUB_WORKSPACE/penwern-ci/scripts/lint-entry.sh" \
            "${GITHUB_REPOSITORY##*/}" \
            "${LANGUAGE}" \
            "$GITHUB_WORKSPACE/target"
