name: reusable-test
on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
    secrets:
      PENWERN_CI_APP_CLIENT_ID:
        required: true
      PENWERN_CI_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  pick-runner:
    # Runs only when the caller opts in; skipped jobs cost no minutes.
    if: vars.CI_RUNNER == 'campc'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Mint runner-probe token
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PENWERN_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.PENWERN_CI_APP_PRIVATE_KEY }}
          owner: penwern
          permission-organization-self-hosted-runners: read
      - name: Pick campc if online, else ubuntu-latest
        id: pick
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          online=0
          if [ -n "$GH_TOKEN" ]; then
            online=$(gh api /orgs/penwern/actions/runners --paginate \
              --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "campc"))] | length' \
              2>/dev/null | awk '{s+=$1} END {print s+0}') || online=0
          fi
          if [ "${online:-0}" -gt 0 ]; then runner=campc; else runner=ubuntu-latest; fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Selected runner: $runner (online campc runners: ${online:-0})"

  test:
    needs: pick-runner
    # Run even when pick-runner was skipped or failed; empty output falls back to hosted.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.pick-runner.outputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          path: target

      - name: Mint penwern-ci read token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PENWERN_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.PENWERN_CI_APP_PRIVATE_KEY }}
          owner: penwern
          repositories: penwern-ci
          permission-contents: read

      - name: Checkout penwern-ci
        uses: actions/checkout@v7
        with:
          repository: penwern/penwern-ci
          ref: v1
          path: penwern-ci
          token: ${{ steps.app_token.outputs.token }}

      - name: Read pinned tool versions
        run: cat penwern-ci/configs/tool-versions.env >> "$GITHUB_ENV"

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: target/go.mod
          cache: false

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up uv
        if: inputs.language == 'python' && hashFiles('target/uv.lock') != ''
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: target/uv.lock

      - name: Install Python test deps (uv)
        if: inputs.language == 'python' && hashFiles('target/uv.lock') != ''
        working-directory: target
        run: |
          uv sync --frozen --python 3.12
          # Top up whichever test tool the lock lacks (test-entry runs pytest --cov).
          if [ ! -x .venv/bin/pytest ]; then
            uv pip install "pytest==${PYTEST_VERSION}"
          fi
          if ! .venv/bin/python -c 'import pytest_cov' 2>/dev/null; then
            uv pip install "pytest-cov==${PYTEST_COV_VERSION}"
          fi
          echo "$GITHUB_WORKSPACE/target/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python test deps
        if: inputs.language == 'python' && hashFiles('target/uv.lock') == ''
        working-directory: target
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install "pytest==${PYTEST_VERSION}" "pytest-cov==${PYTEST_COV_VERSION}"
          fi

      - name: Set up Node
        if: startsWith(inputs.language, 'js-')
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: target/package-lock.json

      - name: Install Node deps
        if: startsWith(inputs.language, 'js-')
        working-directory: target
        run: npm ci

      - name: Run tests (mode resolved centrally from penwern-ci/registry.tsv)
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          export PENWERN_CI_ROOT="$GITHUB_WORKSPACE/penwern-ci"
          bash "$GITHUB_WORKSPACE/penwern-ci/scripts/test-entry.sh" \
            "${GITHUB_REPOSITORY##*/}" \
            "${LANGUAGE}" \
            "$GITHUB_WORKSPACE/target"

      # Coverage visibility (Python). pytest --cov (in test-entry) leaves a .coverage
      # data file in the target checkout; surface the report in the run summary. Best-effort
      # and non-blocking — a soft fail-under threshold is deferred until repos have baselines.
      - name: Coverage summary
        if: ${{ always() && inputs.language == 'python' }}
        working-directory: target
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Test coverage"
              echo '```'
              coverage report 2>/dev/null || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No coverage data (test-mode=none or no tests collected)._" >> "$GITHUB_STEP_SUMMARY"
          fi
