# Canonical [tool.ruff] block. sync-config.sh copies from [tool.ruff] onward, so these header lines never reach a repo.
# Never cat-append this to a pyproject.toml that already defines [tool.ruff] (e.g. penwern-a3m): duplicate TOML tables are invalid. Use sync-config.sh --update or merge by hand.
[tool.ruff]
target-version = "py310"          # bumped from py38 2026-05-20: all onboarded repos deploy to Ubuntu 22.04+ = Python 3.10+; unlocks UP006/UP007 auto-fix
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
